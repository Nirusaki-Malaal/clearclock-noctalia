# Merge into ~/.config/noctalia/*.toml; preserve your other widgets and order.
# Enable the plugin first: noctalia msg plugins enable nirusaki/clearclock
[desktop_widgets]
enabled = true
# If widget_order is already configured, append "clearclock" to that list.

[desktop_widgets.widget.clearclock]
type = "nirusaki/clearclock:desktop"
output = "eDP-1"
cx = 768.0
cy = 456.0
box_width = 700.0
box_height = 300.0
rotation = 0.0

# Preset 1: Frosted Glass Font (translucent beveled digits as seen in the screenshot)
[desktop_widgets.widget.clearclock.settings]
background = false
adaptiveColors = true
adaptiveGradients = false
frostedFont = true
frostedGlass = false
fontGlassStrength = 0.0
clockFontSize = 218
clockUse24hFormat = true
clockShowSeconds = false
clockSeparator = "."
showDayDisplay = true
showDateDisplay = true
dateCustomDateFormat = "%-d %B %Y"
timezone = ""

