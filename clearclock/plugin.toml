id = "nirusaki/clearclock"
name = "ClearClock"
version = "1.2.0"
plugin_api = 31
author = "Nirusaki; original design by qewer33"
license = "GPL-3.0-or-later"
icon = "clock"
description = "ClearClock: a bold clock, script weekday overlay, and spaced date."
tags = ["clock", "desktop", "date", "typography"]
dependencies = ["python3", "python-pillow"]

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"

[[desktop_widget.setting]]
key = "adaptiveColors"
type = "bool"
label_key = "settings.adaptiveColors.label"
description_key = "settings.adaptiveColors.description"
default = true

[[desktop_widget.setting]]
key = "adaptiveGradients"
type = "bool"
label_key = "settings.adaptiveGradients.label"
description_key = "settings.adaptiveGradients.description"
default = true
visible_when = { key = "adaptiveColors", values = ["true"] }

[[desktop_widget.setting]]
key = "frostedGlass"
type = "bool"
label_key = "settings.frostedGlass.label"
description_key = "settings.frostedGlass.description"
default = false

[[desktop_widget.setting]]
key = "glassStrength"
type = "double"
label_key = "settings.glassStrength.label"
default = 0.5
min = 0.0
max = 1.0
visible_when = { key = "frostedGlass", values = ["true"] }

[[desktop_widget.setting]]
key = "frostedFont"
type = "bool"
label_key = "settings.frostedFont.label"
description_key = "settings.frostedFont.description"
default = false

[[desktop_widget.setting]]
key = "fontGlassStrength"
type = "double"
label_key = "settings.fontGlassStrength.label"
default = 0.55
min = 0.0
max = 1.0
visible_when = { key = "frostedFont", values = ["true"] }

# Host-internal instance association. Noctalia's desktop script API provides
# no instance ID or geometry; the defaults service binds this to the saved ID.
# The sentinel is intentionally absent from the boolean control's values.
[[desktop_widget.setting]]
key = "renderInstance"
type = "string"
label_key = "settings.renderInstance.label"
default = ""
visible_when = { key = "adaptiveGradients", values = ["internal"] }

[[desktop_widget.setting]]
key = "clockUse24hFormat"
type = "bool"
label_key = "settings.clockUse24hFormat.label"
default = true

[[desktop_widget.setting]]
key = "clockShowSeconds"
type = "bool"
label_key = "settings.clockShowSeconds.label"
default = false

[[desktop_widget.setting]]
key = "clockSeparator"
type = "string"
label_key = "settings.clockSeparator.label"
default = "."

[[desktop_widget.setting]]
key = "timezone"
type = "string"
label_key = "settings.timezone.label"
default = ""

[[desktop_widget.setting]]
key = "clockFontColor"
type = "color"
label_key = "settings.clockFontColor.label"
default = "#ffffff"
visible_when = { key = "adaptiveColors", values = ["false"] }

[[desktop_widget.setting]]
key = "clockFontFamily"
type = "string"
label_key = "settings.clockFontFamily.label"
default = "ccdefault"

[[desktop_widget.setting]]
key = "clockBoldText"
type = "bool"
label_key = "settings.clockBoldText.label"
default = true

[[desktop_widget.setting]]
key = "clockFontSize"
type = "int"
label_key = "settings.clockFontSize.label"
default = 220
min = 24
max = 400

[[desktop_widget.setting]]
key = "showDayDisplay"
type = "bool"
label_key = "settings.showDayDisplay.label"
default = true

[[desktop_widget.setting]]
key = "dayFontColor"
type = "color"
label_key = "settings.dayFontColor.label"
default = "#5e4573"
visible_when = { key = "adaptiveColors", values = ["false"] }

[[desktop_widget.setting]]
key = "dayFontFamily"
type = "string"
label_key = "settings.dayFontFamily.label"
default = "ccdefault"

[[desktop_widget.setting]]
key = "dayBoldText"
type = "bool"
label_key = "settings.dayBoldText.label"
default = false

[[desktop_widget.setting]]
key = "dayFontSize"
type = "int"
label_key = "settings.dayFontSize.label"
default = 100
min = 16
max = 300

[[desktop_widget.setting]]
key = "showDateDisplay"
type = "bool"
label_key = "settings.showDateDisplay.label"
default = true

[[desktop_widget.setting]]
key = "dateCustomDateFormat"
type = "string"
label_key = "settings.dateCustomDateFormat.label"
default = "%-d %B %Y"

[[desktop_widget.setting]]
key = "dateFontColor"
type = "color"
label_key = "settings.dateFontColor.label"
default = "#ffffff"
visible_when = { key = "adaptiveColors", values = ["false"] }

[[desktop_widget.setting]]
key = "dateFontFamily"
type = "string"
label_key = "settings.dateFontFamily.label"
default = "ccdefault"

[[desktop_widget.setting]]
key = "dateBoldText"
type = "bool"
label_key = "settings.dateBoldText.label"
default = false

[[desktop_widget.setting]]
key = "dateFontSize"
type = "int"
label_key = "settings.dateFontSize.label"
default = 24
min = 8
max = 100

[[desktop_widget.setting]]
key = "dateLetterSpacing"
type = "int"
label_key = "settings.dateLetterSpacing.label"
default = 2
min = 0
max = 20

[[desktop_widget.setting]]
key = "dateGap"
type = "int"
label_key = "settings.dateGap.label"
default = -20
min = -100
max = 100

[[service]]
id = "defaults"
entry = "defaults.luau"
